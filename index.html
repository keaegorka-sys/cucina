<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--ARTIFACT-START-->
<title>Рацион Cucina</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6EF; --card:#FFFFFF; --ink:#231C15; --muted:#8A7E72; --line:#EFE6DA; --soft:#FFF3E8; --soft2:#FFF8F1;
  --acc1:#FFC56F; --acc2:#FF8A5C; --acc:#F07A3E; --accInk:#C2571F; --green:#3E8E5A; --greenSoft:#E8F4EB; --red:#D6453B; --redSoft:#FCE9E6;
  --shadow:0 1px 2px rgba(80,50,20,.05),0 8px 24px rgba(80,50,20,.06);
  --grad:linear-gradient(135deg,var(--acc1),var(--acc2));
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16120E; --card:#211B16; --ink:#F4EBE0; --muted:#A99A8B; --line:#342A22; --soft:#3A2618; --soft2:#2A2019;
    --accInk:#FFA46E; --green:#7CC593; --greenSoft:#1D2E22; --red:#F07A6E; --redSoft:#3A1F1C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16120E; --card:#211B16; --ink:#F4EBE0; --muted:#A99A8B; --line:#342A22; --soft:#3A2618; --soft2:#2A2019;
  --accInk:#FFA46E; --green:#7CC593; --greenSoft:#1D2E22; --red:#F07A6E; --redSoft:#3A1F1C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:Onest,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;color:inherit}
.wrap{max-width:492px;margin:0 auto;padding-block:12px 120px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));min-height:100vh}
.wrap.wide{max-width:792px}
.brand{font-weight:800;font-size:22px;letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
.brand small{display:block;width:44px;height:3px;border-radius:3px;background:var(--grad);margin:6px auto 0}
h1{font-size:26px;line-height:1.15;letter-spacing:-.02em;margin:18px 0 8px;font-weight:800}
h2{font-size:20px;margin:0 0 4px;font-weight:800;letter-spacing:-.01em}
h3{font-size:16px;margin:0 0 10px;font-weight:700}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:13px}
/* --- CTA --- */
.cta-bar{position:fixed;left:0;right:0;bottom:0;padding-top:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:5}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:428px;margin:0 auto;height:56px;border-radius:17px;background:var(--grad);color:#231C15;font-weight:700;font-size:17px;box-shadow:0 10px 24px rgba(255,138,92,.35);transition:transform .15s,opacity .15s}
.cta:active{transform:scale(.98)}
.cta[disabled]{opacity:.45;box-shadow:none;cursor:default}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}
.btn.acc{background:var(--grad);border:0;color:#231C15}
.btn.ghost{background:transparent}
.btn.green{background:var(--green);border:0;color:#fff}
/* --- intro --- */
.intro-top{padding-top:26px;text-align:center}
.intro h1{text-align:center;font-size:28px;margin-top:22px}
.intro .sub{text-align:center}
.steps-card{padding:6px 16px}
.istep{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.istep:last-child{border-bottom:0}
.istep .ic{position:relative;flex:0 0 44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:22px}
.istep .ic b{position:absolute;top:-6px;left:-6px;width:20px;height:20px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:11px;display:grid;place-items:center}
.istep strong{display:block;font-size:15px}
.istep span{color:var(--muted);font-size:13px}
.fineprint{text-align:center;color:var(--muted);font-size:12.5px;margin-top:16px}
/* --- quiz --- */
.qhead{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding-top:6px}
.round{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:20px;font-weight:700}
.segs{display:flex;gap:4px;margin:16px 0 8px}
.segs i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.segs i.on{background:var(--grad)}
.qmeta{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--muted)}
.qmeta b{color:var(--ink);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:92px;padding:14px 10px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;text-align:center;transition:border-color .15s,background .15s}
.opt.row{flex-direction:row;justify-content:flex-start;text-align:left;min-height:68px;gap:14px;padding:12px 16px}
.opt .oe{font-size:26px;line-height:1}
.opt.row .oe{flex:0 0 auto}
.opt.row > span:nth-child(2){display:flex;flex-direction:column;gap:2px;padding-right:26px}
.opt .ot{font-weight:600;font-size:14.5px}
.opt .os{font-size:12.5px;color:var(--muted);font-weight:400}
.opt.on{background:var(--soft);border-color:var(--acc2)}
.opt.on .ot{color:var(--accInk)}
.opt .chk{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--grad);color:#231C15;font-size:11px;font-style:normal;font-weight:800;display:none;place-items:center}
.opt.on .chk{display:grid}
.opt.row .chk{top:50%;transform:translateY(-50%);right:14px}
.grp{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:18px 0 10px;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-weight:500;font-size:14px}
.chip.on{background:var(--soft);border-color:var(--acc2);color:var(--accInk)}
.chip.sm{height:32px;padding:0 11px;font-size:13px;border-radius:10px}
.stepper{display:flex;align-items:center;justify-content:space-between;padding:18px}
.stepper .val{text-align:center}
.stepper .val b{display:block;font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.stepper .val span{color:var(--muted);font-size:13px}
.stepper .round{width:52px;height:52px;font-size:24px;background:var(--soft);box-shadow:none;color:var(--accInk)}
.note{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:var(--soft2);border:1px solid var(--line);margin-top:14px;font-size:13.5px}
.note .ni{font-size:20px}
.note b{display:block;font-size:14px}
.switch{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left}
.switch + .switch{border-top:1px solid var(--line)}
.switch .st{flex:1}
.switch .st b{display:block;font-weight:600}
.switch .st span{font-size:12.5px;color:var(--muted)}
.tgl{flex:0 0 46px;height:28px;border-radius:20px;background:var(--line);position:relative;transition:background .2s}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.tgl.on{background:var(--acc2)}
.tgl.on::after{left:21px}
input[type=range]{width:100%;accent-color:var(--acc2);margin:6px 0}
/* swipe */
.deck{position:relative;height:420px;margin-top:4px}
.tcard{position:absolute;inset:0;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;touch-action:pan-y;user-select:none;cursor:grab;transition:transform .3s,opacity .3s}
.tcard.under{transform:scale(.95) translateY(10px);opacity:.6;pointer-events:none}
.tcard .te{font-size:84px;line-height:1;margin-bottom:14px}
.tcard .tn{font-size:20px;font-weight:800;letter-spacing:-.01em}
.tcard .ti{color:var(--muted);font-style:italic;font-size:13.5px;margin-top:2px}
.tcard .tm{margin-top:10px;font-size:13px;color:var(--muted)}
.tcard .td{margin-top:10px;font-size:13.5px}
.stamp{position:absolute;top:18px;padding:4px 10px;border-radius:8px;font-weight:800;font-size:14px;border:2px solid;opacity:0;transition:opacity .1s}
.stamp.like{left:18px;color:var(--green);border-color:var(--green);transform:rotate(-10deg)}
.stamp.nope{right:18px;color:var(--red);border-color:var(--red);transform:rotate(10deg)}
.swbtns{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;margin-top:16px;align-items:center}
.swbtns .btn{height:50px;border-radius:15px;font-size:14.5px;white-space:nowrap;padding:0 10px}
.swbtns .yes{background:var(--greenSoft);color:var(--green);border-color:transparent}
.swbtns .no{background:var(--redSoft);color:var(--red);border-color:transparent}
.cnt{text-align:center;font-size:13px;color:var(--muted);margin-top:10px}
/* loading */
.loading{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
.pot{font-size:64px;animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-10px) rotate(-6deg)}}
.lbar{width:220px;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.lbar i{display:block;height:100%;width:0;background:var(--grad);animation:fill 1.6s ease forwards}
@keyframes fill{to{width:100%}}
/* --- app --- */
.apphead{display:flex;align-items:center;justify-content:space-between;padding:6px 0 4px}
.apphead .brand{text-align:left;font-size:21px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:5px;margin:10px -4px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.tabs button{height:40px;border-radius:12px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--grad);color:#231C15}
.hero{padding:18px;margin-bottom:14px;background:var(--grad);color:#231C15;border:0}
.hero .hl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.hero h2{font-size:22px;margin:4px 0 12px}
.hero .hs{display:flex;flex-direction:column;gap:8px}
.hero .hs button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.55);text-align:left}
.hero .hs button .he{font-size:26px}
.hero .hs button small{display:block;font-size:12px;opacity:.75}
.hero .hs button b{font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{padding:12px 8px;text-align:center}
.stat b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--muted);line-height:1.2;display:block}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.day{margin-bottom:14px;overflow:hidden}
.day.today{border-color:var(--acc2);box-shadow:0 0 0 3px rgba(255,138,92,.18),var(--shadow)}
.dayh{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px 8px}
.dayh b{font-size:16px;display:inline-block}
.dayh b::first-letter{text-transform:uppercase}
.dayh span{font-size:12.5px;color:var(--muted);text-align:right}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:7px;font-size:11.5px;font-weight:700;background:var(--soft);color:var(--accInk);vertical-align:middle}
.badge.g{background:var(--greenSoft);color:var(--green)}
.badge.b{background:#EEE7FF;color:#5B44B5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.b{background:#2B2443;color:#B9A8FF}}
.slot{display:flex;align-items:center;border-top:1px solid var(--line)}
.slot-main{flex:1;display:flex;align-items:center;gap:12px;padding:12px 6px 12px 16px;text-align:left;min-width:0}
.slot .se{flex:0 0 44px;height:44px;border-radius:14px;background:var(--soft2);display:grid;place-items:center;font-size:24px;position:relative}
.slot.done .se::after{content:"✓";position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:var(--green);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.slot-txt{min-width:0}
.slot-txt .ml{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.slot-txt b{display:block;font-weight:600;font-size:14.5px;line-height:1.25}
.slot-txt .mt{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.slot-tools{display:flex;gap:2px;padding-right:8px}
.tool{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:17px}
.tool:hover{background:var(--soft2);color:var(--accInk)}
.empty{padding:14px 16px;color:var(--muted);font-size:13.5px}
/* shop */
.shopcat{margin-bottom:12px;overflow:hidden}
.shopcat h3{padding:14px 16px 4px;margin:0;font-size:14.5px;display:flex;justify-content:space-between}
.item{display:flex;align-items:flex-start;gap:12px;padding:10px 16px;width:100%;text-align:left;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.cb{flex:0 0 22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px;font-size:12px;font-weight:800;color:transparent}
.item.on .cb{background:var(--green);border-color:var(--green);color:#fff}
.item .in{flex:1;min-width:0}
.item .in b{font-weight:600}
.item{cursor:pointer}
.item a{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.item a:hover{text-decoration-color:var(--acc2)}
.item .iq b{display:block;font-weight:700}
.item .in small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.item .iq{font-weight:600;white-space:nowrap;text-align:right}
.item .iq small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
.item.on .in b,.item.on .iq{text-decoration:line-through;opacity:.5}
/* library */
.search{width:100%;height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;margin-bottom:10px;outline:none}
.search:focus{border-color:var(--acc2)}
.hscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{flex:0 0 auto}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.rc{display:flex;gap:12px;padding:12px;text-align:left;align-items:center}
.rc .se{flex:0 0 48px;height:48px;border-radius:14px;background:var(--soft2);display:grid;place-items:center;font-size:26px}
.rc b{display:block;font-size:14px;line-height:1.25;font-weight:600}
.rc small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.rc.off{opacity:.5}
/* progress */
.skill{display:flex;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);width:100%;text-align:left}
.skill .cb{border-radius:50%}
.skill.on .cb{background:var(--green);border-color:var(--green);color:#fff}
.skill b{font-weight:600;font-size:14px;display:block}
.skill small{color:var(--muted);font-size:12px}
.meter{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:8px 0 2px}
.meter i{display:block;height:100%;background:var(--grad)}
/* modal */
.modal{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(20,12,6,.45);animation:fade .2s}
.sheet{position:relative;width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding-top:20px;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));padding-left:max(18px, env(safe-area-inset-left,0px));padding-right:max(18px, env(safe-area-inset-right,0px));animation:up .25s ease}
.sync{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:24px;max-height:88vh}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.x{position:sticky;top:0;float:right;width:36px;height:36px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:18px;z-index:2}
.rhero{display:flex;gap:14px;align-items:center;margin:4px 0 12px;padding-right:40px}
.rhero .re{flex:0 0 64px;height:64px;border-radius:20px;background:var(--soft);display:grid;place-items:center;font-size:36px}
.rhero h2{font-size:21px;line-height:1.2}
.rhero .it{color:var(--muted);font-style:italic;font-size:13.5px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.meta span{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:9px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:600}
.learn{padding:12px 14px;border-radius:16px;background:var(--soft);margin:12px 0 16px}
.learn small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accInk)}
.learn b{font-weight:600}
.sec{padding:14px 16px;margin-bottom:12px}
.sec h3{display:flex;justify-content:space-between;align-items:center}
.por{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.por button{width:30px;height:30px;border-radius:9px;background:var(--soft);color:var(--accInk);font-weight:800}
.ing{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px dashed var(--line);font-size:14.5px}
.ing:first-of-type{border-top:0}
.ing span:last-child{font-weight:600;white-space:nowrap}
.ing em{color:var(--muted);font-size:12px;font-style:normal}
.stp{display:flex;gap:12px;padding:10px 0;border-top:1px dashed var(--line);text-align:left;width:100%;font-size:14.5px}
.stp:first-of-type{border-top:0}
.stp i{flex:0 0 26px;height:26px;border-radius:50%;background:var(--soft);color:var(--accInk);font-style:normal;font-weight:800;font-size:13px;display:grid;place-items:center}
.stp.on{opacity:.45}
.stp.on i{background:var(--green);color:#fff}
.stp{cursor:pointer}
.stp .tchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tchip{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 11px;border-radius:9px;background:var(--soft);color:var(--accInk);font-weight:700;font-size:13px}
.tchip:hover{background:var(--acc2);color:#231C15}
.tcustom{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 10px}
.dropchip{margin-top:6px;height:28px;font-size:12px;background:var(--redSoft);color:var(--red)}
.dropchip:hover{background:var(--red);color:#fff}
/* калькулятор калорий */
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 0}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.fld input{width:100%;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0 12px;font-size:16px;font-weight:600;color:var(--ink);outline:none}
.fld input:focus{border-color:var(--acc2)}
.arow{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;padding:9px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card)}
.arow b{font-size:14px;font-weight:600}
.arow small{color:var(--muted);font-size:12px}
.arow.on{background:var(--soft);border-color:var(--acc2)}
.arow.on b{color:var(--accInk)}
.bcres{display:flex;align-items:baseline;gap:8px;margin:16px 0 4px}
.bcres b{font-size:34px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
/* фото блюд */
.pic{position:relative;overflow:hidden}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.pic em{font-style:normal}
.tph{display:grid;place-items:center;width:100%;height:170px;border-radius:16px;background:var(--soft2);font-size:72px;margin-bottom:14px;flex:0 0 auto}
.hero .hs button .he{flex:0 0 52px;height:52px;border-radius:12px;display:grid;place-items:center;font-size:26px;background:rgba(255,255,255,.5)}
.rphoto{margin:0 0 14px}
.rphoto img{display:block;width:100%;max-width:100%;aspect-ratio:4/3;max-height:340px;object-fit:cover;border-radius:18px;background:var(--soft2)}
.rphoto figcaption{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.35}
.rphoto figcaption a{color:inherit}
/* таймеры */
.tdock{position:fixed;z-index:25;right:max(12px, env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;width:min(340px, calc(100vw - 24px))}
.tdock:empty{display:none}
.tm{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--ink);color:var(--bg);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.tm .tmain{flex:1;min-width:0}
.tm small{display:block;font-size:11.5px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tm .tl{font-size:12px;opacity:.8;margin-left:6px}
.tm .tb{display:flex;gap:4px}
.tm button{height:36px;min-width:36px;padding:0 10px;border-radius:10px;background:rgba(127,127,127,.25);color:inherit;font-weight:700;font-size:14px}
.tm.ring{background:var(--red);color:#fff;animation:ringp 1s ease-in-out infinite}
.tm.ring button{background:#fff;color:var(--red)}
.tm.paused b{opacity:.6}
@keyframes ringp{50%{transform:scale(1.025)}}
body.has-timers .wrap{padding-bottom:220px}
body.has-timers .sheet{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.tip{padding:12px 14px;border-radius:14px;background:var(--greenSoft);font-size:14px;margin-bottom:12px}
.stars{display:flex;gap:6px;margin:8px 0}
.stars button{font-size:28px;line-height:1;color:var(--line)}
.stars button.on{color:#F5A623}
textarea{width:100%;min-height:70px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:10px 12px;outline:none;resize:vertical}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:30;animation:fade .2s}
.pick{display:flex;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);width:100%;text-align:left}
.pick .se{flex:0 0 40px;height:40px;border-radius:12px;background:var(--soft2);display:grid;place-items:center;font-size:22px}
.pick b{display:block;font-weight:600;font-size:14px}
.pick small{color:var(--muted);font-size:12px}
@media print{
  body{background:#fff;color:#000}
  .tabs,.apphead,.rowbtns,.cta-bar,.noprint,.slot-tools{display:none!important}
  .card{box-shadow:none;border-color:#ddd;break-inside:avoid}
  .wrap{max-width:none;padding:0}
}
</style>
</head>
<body>
<!--ARTIFACT-BODY-->
<div id="app"></div>

<script src="recipes.js"></script>
<script src="recipes-book.js"></script>

<script>
'use strict';
/* =================== ДАННЫЕ И ХЕЛПЕРЫ =================== */
const RECIPES = window.RECIPES || [];
const PRICES = window.PRICES || {};
const R = {}; RECIPES.forEach(r => R[r.id] = r);
/* Фото блюд (Wikimedia Commons). Если фото нет или оно не загрузилось — остаётся эмодзи. */
const PHOTOS = window.PHOTOS || {};
function pic(r, cls){
  const p = PHOTOS[r.id];
  return `<span class="${cls} pic">${p ? `<img src="${esc(p.f)}" alt="" loading="lazy">` : ''}<em>${r.e}</em></span>`;
}
function photoFigure(r){
  const p = PHOTOS[r.id]; if (!p) return '';
  return `<figure class="rphoto"><img src="${esc(p.f)}" alt="${esc(r.n)}"><figcaption>Фото для примера: ${esc(p.a)}, ${esc(p.l)}, <a href="${esc(p.u)}" target="_blank" rel="noopener">Wikimedia Commons</a></figcaption></figure>`;
}
document.addEventListener('error', e => { const t = e.target; if (t && t.tagName === 'IMG' && t.closest('.pic, .rphoto')) { const f = t.closest('.rphoto'); f ? f.remove() : t.remove(); } }, true);
const KEY = 'cucina-italiana-v1';

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const todayISO = () => iso(new Date());
const WD = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const WDS = ['вс','пн','вт','ср','чт','пт','сб'];
const MON = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const plural = (n, f) => { if (!Number.isInteger(n)) return f[1]; const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? f[2] : b > 1 && b < 5 ? f[1] : b === 1 ? f[0] : f[2]; };
const num = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const rub = n => num(n) + ' ₽';
const clone = o => JSON.parse(JSON.stringify(o));
function hash(s){ let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }

const MEAL = { b:{t:'Завтрак', e:'☕'}, l:{t:'Обед', e:'🍝'}, d:{t:'Ужин', e:'🍽'}, x:{t:'Проект выходного', e:'🧑‍🍳'} };
const CATS = [['v','Овощи, зелень, фрукты','🥬'],['m','Мясо и птица','🥩'],['f','Рыба и морепродукты','🐟'],['d','Молочное, сыры, яйца','🧀'],['g','Бакалея','🌾'],['c','Консервы и соусы','🥫'],['b','Хлеб и выпечка','🥖'],['o','Вино и напитки','🍷'],['s','Базовое — проверь, есть ли дома','🧂']];
const TAGS = { gluten:'глютен', lactose:'лактоза', eggs:'яйца', nuts:'орехи', fish:'рыба', seafood:'морепродукты', meat:'мясо', pork:'свинина', mushrooms:'грибы', spicy:'острое', garlic:'чеснок', onion:'лук', pepper:'болгарский перец', eggplant:'баклажаны', olives:'оливки и каперсы', alcohol:'вино в блюдах' };
const EXCL = {
  allergy: [['gluten','🌾','Глютен'],['lactose','🥛','Лактоза'],['eggs','🥚','Яйца'],['nuts','🌰','Орехи'],['fish','🐟','Рыба'],['seafood','🦐','Морепродукты']],
  dislike: [['mushrooms','🍄','Грибы'],['pork','🥓','Свинина'],['spicy','🌶','Острое'],['garlic','🧄','Чеснок'],['onion','🧅','Лук'],['pepper','🫑','Болгарский перец'],['eggplant','🍆','Баклажаны'],['olives','🫒','Оливки и каперсы'],['alcohol','🍷','Вино в блюдах']]
};
const DIETS = [['all','🥩','Всеядное','Ем всё: мясо, рыбу, овощи'],['pesc','🐟','Пескетарианство','Рыба и морепродукты, без мяса'],['veg','🧀','Вегетарианство','Без мяса и рыбы'],['vegan','🌱','Веганство','Только растительное']];
const LEVELS = [[1,'🌱','Новичок','В будни — простые блюда, в выходные — шаг вперёд'],[2,'🍳','Уже готовлю','Будни — средние рецепты, выходные — сложные'],[3,'🔥','Хочу вызов','Сложные техники в любой день']];
const UNIT = { 'пучок':['пучок','пучка','пучков'], 'стебель':['стебель','стебля','стеблей'], 'веточка':['веточка','веточки','веточек'], 'зубч':['зубчик','зубчика','зубчиков'], 'щепотка':['щепотка','щепотки','щепоток'], 'шт':['шт','шт','шт'], 'головка':['головка','головки','головок'] };
const NOKEEP = new Set(['salad','pizza']);
const NOKEEP_ID = new Set(['calamari','arancini','milanese','tuna_steak','eggs_toast']);
const keeps = r => r && !NOKEEP.has(r.t) && !NOKEEP_ID.has(r.id);

function defaults(){
  const t = new Date(); t.setDate(t.getDate() + 1);
  return { diet:'all', excl:[], taste:{}, people:2, meals:{b:true,l:true,d:true}, leftovers:false, project:true,
    kcal:1800, body:null, budgetOn:true, budget:9000, cheap:false, eq:{oven:true, fry:true}, level:1, wdTime:45, start:iso(t), days:7, book:true };
}
function load(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } }
function save(){ S.updated = Date.now(); saveLocal(); queueCloud(); }
function saveLocal(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
const EMPTY = () => ({ a:null, plan:null, shop:{}, log:[], tab:'menu', updated:0 });
let S = Object.assign(EMPTY(), load() || {});

/* ---------- синхронизация через аккаунт Claude (работает только в версии-ссылке Claude) ---------- */
const CLOUD = { ref:null, status:'local', chain:Promise.resolve(), timer:null };
const SYNC_TEXT = {
  local: 'Данные хранятся в этом браузере',
  loading: 'Подключаемся к твоему аккаунту…',
  synced: '☁ Сохранено в твоём аккаунте — видно только тебе, одинаково на телефоне и компьютере',
  offline: 'Нет связи с хранилищем — изменения сохранятся, когда связь появится',
  error: 'Не получилось сохранить в аккаунт — данные остались в этом браузере'
};
function setSync(s){ CLOUD.status = s; document.querySelectorAll('.sync').forEach(el => el.textContent = SYNC_TEXT[s]); }
function queueCloud(){ if (!CLOUD.ref) return; clearTimeout(CLOUD.timer); CLOUD.timer = setTimeout(pushCloud, 800); }
function pushCloud(){
  if (!CLOUD.ref) return;
  const body = { json: JSON.stringify(S), updated: S.updated || Date.now() };
  CLOUD.chain = CLOUD.chain.then(() => CLOUD.ref.set(body)).then(() => setSync('synced'), () => setSync('error'));
}
function adoptRemote(d){
  try {
    const remote = JSON.parse(d.json), tab = S.tab;
    S = Object.assign(EMPTY(), remote); S.tab = tab || 'menu'; saveLocal();
    if (view === 'intro' || view === 'app') { view = S.plan ? 'app' : 'intro'; render(); }
    if (M && M.kind === 'recipe') renderModal();
  } catch(e) {}
}
async function initCloud(){
  if (!window.claude || typeof window.claude.use !== 'function') return;
  const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  if (!db || !user) return;
  const id = await user.id(); if (!id) return;
  const ref = db.doc('data/users/' + id + '/cucina');
  setSync('loading');
  const timer = setTimeout(() => { if (CLOUD.status === 'loading') setSync('offline'); }, 10000);
  try {
    const snap = await ref.get();
    clearTimeout(timer);
    CLOUD.ref = ref;
    const d = snap.exists ? snap.data() : null;
    if (d && d.json && (d.updated || 0) > (S.updated || 0)) { adoptRemote(d); setSync('synced'); }
    else if (S.a || S.plan || S.log.length) pushCloud();
    else setSync('synced');
  } catch(e) { clearTimeout(timer); setSync('error'); return; }
  ref.onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites || !snap.exists) return;
    const d = snap.data();
    if (d && d.json && (d.updated || 0) > (S.updated || 0)) adoptRemote(d);
  }, () => setSync('error'));
}

/* ---------- фильтры по настройкам ---------- */
function effExcl(a){
  const s = new Set(a.excl);
  const add = l => l.forEach(x => s.add(x));
  if (a.diet === 'pesc') add(['meat','pork']);
  if (a.diet === 'veg') add(['meat','pork','fish','seafood']);
  if (a.diet === 'vegan') add(['meat','pork','fish','seafood','eggs','lactose']);
  s.cheap = !!a.cheap;
  return s;
}
/* Экономные замены: [новое название, цена за единицу] */
const CHEAP = {
  'Пармезан': ['Твёрдый сыр (вместо пармезана)', 0.9], 'Пекорино романо': ['Твёрдый сыр (вместо пекорино)', 0.9], 'Пекорино': ['Твёрдый сыр (вместо пекорино)', 0.9],
  'Рикотта салата или пекорино': ['Брынза или твёрдый сыр', 0.8], 'Прошутто': ['Ветчина (вместо прошутто)', 1.1], 'Прошутто или ветчина': ['Ветчина', 1.1],
  'Гуанчале или панчетта': ['Бекон (вместо гуанчале)', 1.2], 'Кедровые орехи': ['Грецкие орехи или семечки (вместо кедровых)', 1.2],
  'Фонтина или другой полутвёрдый сыр': ['Полутвёрдый сыр (российский, гауда)', 0.9], 'Горгонзола': ['Сыр с голубой плесенью или брынза', 1.6],
  'Вонголе или мидии в раковинах': ['Мидии в раковинах (замороженные)', 0.8], 'Стейк тунца': ['Филе минтая или хека', 0.6]
};
Object.keys(CHEAP).forEach(k => { const r = RECIPES.find(x => x.ing.some(i => i[0] === k)); if (!r) return; const u = r.ing.find(i => i[0] === k)[2]; PRICES[CHEAP[k][0] + '|' + u] = CHEAP[k][1]; });
const ingFor = (r, ex) => r.ing.filter(i => !(typeof i[4] === 'string' && ex.has(i[4])))
  .map(i => ex.cheap && CHEAP[i[0]] ? [CHEAP[i[0]][0]].concat(i.slice(1)) : i);
const dropped = (r, ex) => r.ing.filter(i => typeof i[4] === 'string' && ex.has(i[4]));
function whyNot(r, a, ex){
  const bad = r.al.filter(t => ex.has(t)).map(t => TAGS[t] || t);
  if (bad.length) return 'есть: ' + bad.join(', ');
  if (r.eq.includes('oven') && !a.eq.oven) return 'нужна духовка';
  if (r.eq.includes('fry') && !a.eq.fry) return 'нужен фритюр';
  if (a.taste[r.id] === -1) return 'отмечено «не моё»';
  return '';
}
const eligible = (r, a, ex, ignoreTaste) => !r.al.some(t => ex.has(t)) && r.eq.every(e => a.eq[e]) && (ignoreTaste || a.taste[r.id] !== -1);

function dietBadge(r, ex){
  const t = new Set(r.al); ingFor(r, ex).forEach(i => { if (typeof i[4] === 'string') t.add(i[4]); if (i[3] === 'd') t.add('lactose'); if (i[3] === 'm') t.add('meat'); });
  if (t.has('meat') || t.has('pork')) return '🥩 мясо';
  if (t.has('fish') || t.has('seafood')) return '🐟 рыба';
  if (t.has('eggs') || t.has('lactose')) return '🧀 вегетар.';
  return '🌱 веган';
}
const dots = d => '●'.repeat(d) + '○'.repeat(3 - d);
const DIFF = ['', 'легко', 'средне', 'сложно'];

/* =================== КАЛЬКУЛЯТОР НОРМЫ КАЛОРИЙ =================== */
/* Формула Миффлина — Сан-Жеора: обмен в покое × коэффициент активности, затем поправка на цель. */
const ACT = [[1.2, 'Сидячий образ жизни', 'офис, почти без тренировок'], [1.375, 'Лёгкая активность', '1–3 тренировки в неделю'],
  [1.55, 'Средняя активность', '3–5 тренировок в неделю'], [1.725, 'Высокая активность', '6–7 тренировок или физический труд']];
const GOALS = [['lose', 'Похудеть', '−15%'], ['keep', 'Держать вес', 'без изменений'], ['gain', 'Набрать', '+10%']];
const bodyDefaults = () => ({ sex:'f', age:'', height:'', weight:'', act:1.375, goal:'keep' });
function calcKcal(b){
  const h = Number(b.height), w = Number(b.weight), a = Number(b.age);
  if (!(h >= 120 && h <= 220 && w >= 30 && w <= 250 && a >= 18 && a <= 80)) return null;
  const bmr = 10 * w + 6.25 * h - 5 * a + (b.sex === 'm' ? 5 : -161);
  const tdee = bmr * b.act, bmi = w / Math.pow(h / 100, 2);
  let goal = b.goal, notes = [];
  if (goal === 'lose' && bmi < 18.5) { goal = 'keep'; notes.push('При таком ИМТ худеть не стоит, поэтому показана норма для поддержания веса.'); }
  let kcal = tdee * (goal === 'lose' ? 0.85 : goal === 'gain' ? 1.10 : 1);
  const floor = b.sex === 'm' ? 1500 : 1200;
  if (kcal < floor) { kcal = floor; notes.push('Ниже ' + num(floor) + ' ккал в день без врача опускаться не стоит — взят этот минимум.'); }
  kcal = Math.min(3500, Math.max(1200, Math.round(kcal / 50) * 50));
  return { bmr: Math.round(bmr), tdee: Math.round(tdee), kcal, bmi, goal, notes };
}
function bmiLabel(x){ return x < 18.5 ? 'ниже нормы' : x < 25 ? 'в пределах нормы' : x < 30 ? 'выше нормы' : 'значительно выше нормы'; }
function calcResultHTML(d){
  const b = d.body, r = calcKcal(b);
  if (!r) return `<p class="muted small" style="margin:14px 0 0">Введи рост (120–220 см), вес (30–250 кг) и возраст (18–80 лет) — и я посчитаю норму. Формула рассчитана на взрослых.</p>`;
  const delta = r.goal === 'lose' ? ' · цель −15%' : r.goal === 'gain' ? ' · цель +10%' : '';
  return `<div class="bcres"><b>${num(r.kcal)}</b><span class="muted">ккал в день</span></div>
    <p class="muted small" style="margin:0 0 10px">Обмен в покое ${num(r.bmr)} · с учётом активности ${num(r.tdee)}${delta}.<br>ИМТ ${r.bmi.toFixed(1).replace('.', ',')} — ${bmiLabel(r.bmi)}.</p>
    ${r.notes.map(n => `<p class="small" style="margin:0 0 10px;color:var(--red)">${esc(n)}</p>`).join('')}
    <button class="btn acc" style="width:100%;height:46px" data-act="bApply">Применить ${num(r.kcal)} ккал</button>
    <p class="muted small" style="margin:10px 0 0">Это оценка по формуле Миффлина — Сан-Жеора, а не медицинская рекомендация. При беременности, кормлении грудью, диабете и других состояниях норму лучше уточнить у врача.</p>`;
}
function calcBlock(d){
  const btn = `<button class="btn" style="width:100%;height:46px;margin-top:12px" data-act="bToggle">🧮 ${Q.calc ? 'Скрыть калькулятор' : 'Посчитать по росту и весу'}</button>`;
  if (!Q.calc || !d.body) return btn;
  const b = d.body, chip = (k, v, on, t) => `<button class="chip sm${on ? ' on' : ''}" data-act="bset" data-k="${k}" data-v="${v}">${t}</button>`;

/* ---------- товары METRO ---------- */
const MET = (window.METRO && window.METRO.items) || {};
const SPOON = { 'ст.л.':15, 'ч.л.':5, 'щепотка':0.5 };
function prod(name){

}
/* сколько единиц упаковки (г / мл / шт) в q единицах рецепта; null — не переводится */
function toPack(pr, q, unit){

function gramsPer(name, unit){

/* ---------- цены ---------- */

    return pr.pack ? n / pr.pack * pr.p : 0;

    let v = q < 20 ? Math.max(1, Math.round(q)) : Math.round(q / 5) * 5;
    if (v >= 1000) return String(Math.round(v / 100) / 10).replace('.', ',') + (u === 'г' ? ' кг' : ' л');
    return v + ' ' + u;
  }
  const word = v => { const f = UNIT[u]; return f ? plural(v, f) : u; };
  const r = Math.round(q);
  if (r >= 1 && Math.abs(q - r) < 0.15) return r + ' ' + word(r);

function mealsPerDay(a){ return ['b','l','d'].filter(m => a.meals[m]).length || 1; }

}
function score(r, m, ctx){

  if (a.taste[r.id] === 1) s += 4;
  const lg = S.log.filter(l => l.id === r.id);
  if (lg.length && lg[lg.length - 1].rating >= 4) s += 1.2;
  if (!lg.length) s += 0.8;                                    // ещё не готовили — новая техника
  if (a.book && r.book) s += 1.2;

  if (m === 'l' && r.c === 'primo') s += 1.8;                  // по-итальянски: обед — primo
  if (m === 'd' && r.c === 'secondo') s += 1.8;                // ужин — secondo
  for (const k in ctx.day.slots) { const o = R[ctx.day.slots[k].id]; if (!o || k === m) continue;

    const target = Math.max(40, (a.budget - proj) / (a.people * mealsPerDay(a) * 7) * 0.92);  // ~8% уходит на округление упаковок

}
function pickBest(pool, m, ctx){

function buildPlan(a, seed){
  const ex = effExcl(a), pool = RECIPES.filter(r => eligible(r, a, ex));
  const base = { a, ex, rand: rng(seed), used:{}, ings:new Set() };
  const days = [], start = parseISO(a.start);
  for (let i = 0; i < a.days; i++) {
    const date = addDays(start, i), wd = date.getDay();
    const day = { date: iso(date), weekend: wd === 0 || wd === 6, slots:{} }; days.push(day);
    for (const m of ['b','l','d']) {
      if (!a.meals[m]) continue;

}
function planCtx(di, m, reject){

/* ---------- подсчёты по плану ---------- */
function slotPortions(di, m){

function slotPF(di, m){ if (m === 'x') return 1; const sl = S.plan.days[di].slots[m]; return sl && sl.left ? dayPF(di - 1) : dayPF(di); }
const pfStr = pf => '×' + String(pf).replace('.', ',');
function shopping(){
  const a = S.a, ex = effExcl(a), items = {};

function switchHTML(k, on, t, s){ return `<button class="switch" data-act="tog" data-k="${k}"><span class="st"><b>${t}</b><span>${s}</span></span><span class="tgl${on ? ' on' : ''}"></span></button>`; }
function tasteHTML(){
  const d = Q.d;
  if (Q.ti >= Q.deck.length) {
    const likes = Object.keys(d.taste).filter(k => d.taste[k] === 1 && R[k]), nopes = Object.keys(d.taste).filter(k => d.taste[k] === -1 && R[k]);
    return `<div class="card" style="padding:18px;text-align:center"><div style="font-size:48px">🤌</div><h2>Вкусовая карта готова</h2><p class="muted small" style="margin:4px 0 0">❤️ нравится: ${likes.length} · ✕ не моё: ${nopes.length}</p></div>

      ${nopes.length ? `<div class="grp">Не моё — не предложим</div><div class="chips">${nopes.map(k => `<button class="chip sm" data-act="tasteSet" data-id="${k}" data-v="0" title="Вернуть">${R[k].e} ${esc(R[k].n)} ↺</button>`).join('')}</div>` : ''}

  }
  const ex = effExcl(d);
  const card = (id, cls) => { const r = R[id]; return `<div class="card tcard ${cls}" ${cls ? '' : 'id="tcard"'}>
    <span class="stamp like">НРАВИТСЯ</span><span class="stamp nope">НЕ МОЁ</span>

  const next = Q.deck[Q.ti + 1];
  return `<div class="deck">${next ? card(next, 'under') : ''}${card(Q.deck[Q.ti], '')}</div>
    <div class="swbtns"><button class="btn no" data-act="taste" data-v="-1">✕ Не моё</button><button class="btn ghost small" data-act="taste" data-v="0">Пропустить</button><button class="btn yes" data-act="taste" data-v="1">❤ Нравится</button></div>
    <div class="cnt">${Q.ti + 1} из ${Q.deck.length}</div>`;
}
function bindSwipe(){
  const c = document.getElementById('tcard'); if (!c) return;
  let x0 = null, dx = 0; const lk = c.querySelector('.like'), np = c.querySelector('.nope');
  c.addEventListener('pointerdown', e => { x0 = e.clientX; dx = 0; c.setPointerCapture(e.pointerId); c.style.transition = 'none'; });
  c.addEventListener('pointermove', e => { if (x0 === null) return; dx = e.clientX - x0; c.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`; lk.style.opacity = Math.max(0, Math.min(1, dx / 90)); np.style.opacity = Math.max(0, Math.min(1, -dx / 90)); });
  const end = () => { if (x0 === null) return; x0 = null; c.style.transition = ''; if (Math.abs(dx) > 90) react(dx > 0 ? 1 : -1); else { c.style.transform = ''; lk.style.opacity = np.style.opacity = 0; } };
  c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
}
function react(v){
  const c = document.getElementById('tcard'), id = Q.deck[Q.ti];
  if (v) Q.d.taste[id] = v; else delete Q.d.taste[id];
  const go = () => { Q.ti++; render(); };
  if (c && v) { c.style.transform = `translateX(${v * 500}px) rotate(${v * 25}deg)`; c.style.opacity = 0; setTimeout(go, 220); } else go();
}

/* Находит в тексте шага время: «10 минут», «10–12 минут», «30 секунд», «1,5–2 часа».
   Не трогает «за 10 минут», «на 2 минуты меньше» и всё длиннее 4 часов. */
function stepTimers(s){
  const re = /(\d+(?:[.,]\d+)?)(?:\s*[–—-]\s*(\d+(?:[.,]\d+)?))?\s*(секунд|сек|минут|мин|час)/gi;
  const out = [], seen = new Set(); let m;
  while ((m = re.exec(s))) {
    const before = s.slice(Math.max(0, m.index - 4), m.index).toLowerCase();
    const after = s.slice(re.lastIndex, re.lastIndex + 14).toLowerCase();
    if (/за\s$/.test(before) || /^[а-яё]*\s+меньше/.test(after)) continue;
    const unit = m[3].toLowerCase(), mul = unit.startsWith('сек') ? 1 : unit.startsWith('час') ? 3600 : 60;
    const a = parseFloat(m[1].replace(',', '.')), b = m[2] ? parseFloat(m[2].replace(',', '.')) : a;
    const sec = Math.round(a * mul), max = Math.round(b * mul);
    if (sec < 10 || sec > 4 * 3600) continue;
    const label = (m[2] ? m[1] + '–' + m[2] : m[1]) + ' ' + (mul === 1 ? 'сек' : mul === 60 ? 'мин' : 'ч');
    if (!seen.has(label)) { seen.add(label); out.push({ sec, max, label }); }
  }
  return out;
}

function confirmHTML(){
  return `<h2>${esc(M.title)}</h2><p class="muted" style="margin:6px 0 18px">${esc(M.text)}</p>
    <div style="display:flex;gap:8px"><button class="btn acc" style="flex:1;height:46px" data-act="confirmOk">${esc(M.ok)}</button><button class="btn" style="flex:1;height:46px" data-act="close">Отмена</button></div>`;
}
function renderModal(){
  const el = $('#modal');
  if (!M) { el.hidden = true; el.innerHTML = ''; document.body.classList.remove('lock'); return; }
  const top = el.querySelector('.sheet') ? el.querySelector('.sheet').scrollTop : 0;
  el.innerHTML = `<div class="backdrop" data-act="close"></div><div class="sheet">${M.kind === 'pick' ? pickerHTML() : M.kind === 'confirm' ? confirmHTML() : recipeHTML()}</div>`;
  el.hidden = false; document.body.classList.add('lock');
  el.querySelector('.sheet').scrollTop = top;
}

/* =================== РЕНДЕР И СОБЫТИЯ =================== */
function render(){
  const app = $('#app');
  app.innerHTML = view === 'intro' ? introHTML() : view === 'quiz' ? quizHTML() : view === 'loading' ? loadingHTML() : appHTML();
  if (view === 'quiz') bindSwipe();
}
let toastT;
function toast(t){ let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); } el.textContent = t; clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 2200); }
function finishQuiz(){
  S.a = clone(Q.d); view = 'loading'; render(); window.scrollTo(0, 0);
  const msgs = ['Варим пасту аль денте…', 'Считаем помидоры…', 'Натираем пармезан…', 'Составляем список покупок…'];
  let i = 0; const iv = setInterval(() => { const el = $('#lmsg'); if (el) el.textContent = msgs[++i % msgs.length]; }, 420);
  setTimeout(() => { clearInterval(iv); S.plan = buildPlan(S.a, Date.now() >>> 0); S.shop = {}; S.tab = 'menu'; save(); view = 'app'; render(); window.scrollTo(0, 0); }, 1700);
}
function shopText(){
  const items = shopping(); let t = `🛒 Покупки в ${window.METRO ? window.METRO.store : 'магазине'} на ${weekTitle()} (${S.a.people} чел.)\n`;
  let sum = 0;
  CATS.forEach(c => { const l = items.filter(i => i.cat === c[0] && !S.shop[i.k]); if (!l.length) return; t += `\n${c[1]}\n`;
    l.forEach(i => { if (!i.base) sum += i.cost; t += `— ${i.name} — ${i.label}${i.cost ? ' — ' + rub(i.cost) : ''}${i.opt ? ' (по желанию)' : ''}\n`; }); });
  return t + `\nИтого без базового: ${rub(sum)}`;
}
function copy(text){
  const done = () => toast('Список скопирован');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallback());
  else fallback();
  function fallback(){ const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch(e) { toast('Не удалось скопировать'); } ta.remove(); }
}
function setPath(o, path, v){ const p = path.split('.'); let x = o; while (p.length > 1) x = x[p.shift()]; x[p[0]] = v; }
function getPath(o, path){ return path.split('.').reduce((x, k) => x[k], o); }

document.addEventListener('click', e => {
  if (e.target.closest('a[href]')) return;            // ссылка на товар открывается, галочка не ставится
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const A = el.dataset.act, ds = el.dataset;
  switch (A) {
    case 'start': startQuiz(false); enterStep(); render(); break;
    case 'back':
      if (Q.step > 0) { Q.step--; enterStep(); } else view = Q.from === 'app' && S.plan ? 'app' : 'intro';
      render(); window.scrollTo(0, 0); break;
    case 'next':
      if (Q.step < STEPS.length - 1) { Q.step++; enterStep(); render(); window.scrollTo(0, 0); } else finishQuiz();
      break;
    case 'set': Q.d[ds.k] = ds.num ? Number(ds.v) : ds.v; render(); break;
    case 'tog': {
      const tgt = view === 'quiz' ? Q.d : S.a; setPath(tgt, ds.k, !getPath(tgt, ds.k));
      if (ds.k === 'budgetOn' && Q.d.budgetOn && Q.d.budget < 1500 * Q.d.people) Q.d.budget = 4500 * Q.d.people;
      render(); break;
    }
    case 'excl': { const i = Q.d.excl.indexOf(ds.v); i >= 0 ? Q.d.excl.splice(i, 1) : Q.d.excl.push(ds.v); render(); break; }
    case 'num': {
      const prev = Q.d[ds.k];
      let v = (prev || (ds.k === 'kcal' ? 1700 : 0)) + Number(ds.d); v = Math.max(Number(ds.min), Math.min(Number(ds.max), v)); Q.d[ds.k] = v;
      if (ds.k === 'people' && prev !== v) Q.d.budget = Math.max(1500 * v, Math.min(10000 * v, Math.round(Q.d.budget / prev * v / 500) * 500));
      render(); break;
    }
    case 'dropTag': {
      const tag = ds.tag, nm = TAGS[tag] || tag;
      ask('Убрать ' + nm + '?', 'Уберём его из рецептов, а блюда, где он главный, заменим другими. Остальное меню не изменится.', 'Убрать', () => {
        if (!S.a.excl.includes(tag)) S.a.excl.push(tag);
        const n = replaceIneligible(); save(); render();
        toast(nm.charAt(0).toUpperCase() + nm.slice(1) + ' убран' + (n ? ' · заменено блюд: ' + n : ''));
      });
      break;
    }
    case 'bToggle': Q.calc = !Q.calc; if (Q.calc && !Q.d.body) Q.d.body = bodyDefaults(); render(); break;
    case 'bset': Q.d.body[ds.k] = ds.k === 'act' ? Number(ds.v) : ds.v; render(); break;
    case 'bApply': { const r = calcKcal(Q.d.body); if (r) { Q.d.kcal = r.kcal; Q.calc = false; render(); toast('Норма: ' + num(r.kcal) + ' ккал в день'); } break; }
    case 'taste': react(Number(ds.v)); break;
    case 'tasteSet': delete Q.d.taste[ds.id]; render(); break;
    case 'tasteMore': Q.deck = tasteDeck(Q.d, true); Q.ti = 0; render(); break;
    case 'tab': S.tab = ds.v; save(); render(); window.scrollTo(0, 0); break;
    case 'settings': startQuiz(true); enterStep(); render(); window.scrollTo(0, 0); break;
    case 'regen':
      ask('Собрать новое меню?', 'Текущие замены и отметки в списке покупок сбросятся. Прогресс останется.', 'Собрать заново', () => { S.plan = buildPlan(S.a, Date.now() >>> 0); S.shop = {}; save(); render(); toast('Новое меню готово'); });
      break;
    case 'confirmOk': { const f = CONF; CONF = null; M = null; renderModal(); if (f) f(); break; }
    case 'open': ds.id ? openRecipe(ds.id) : openRecipe(S.plan.days[ds.di].slots[ds.m].id, Number(ds.di), ds.m); break;
    case 'close': M = null; renderModal(); break;
    case 'swap': swapSlot(Number(ds.di), ds.m); if (M) { M = null; renderModal(); } break;
    case 'pick': M = { kind:'pick', di:Number(ds.di), m:ds.m, q:'' }; renderModal(); break;
    case 'pickSet': setSlot(M.di, M.m, ds.id); M = null; renderModal(); render(); toast(R[ds.id].e + ' ' + R[ds.id].n); break;
    case 'por': M.portions = Math.max(1, Math.min(20, M.portions + Number(ds.d))); renderModal(); break;
    case 'stp': { const i = Number(ds.i); M.steps.has(i) ? M.steps.delete(i) : M.steps.add(i); renderModal(); break; }
    case 'tCustom': M.custom = !M.custom; renderModal(); break;
    case 'timer': {
      const r = M && R[M.id], st = Number(ds.step);
      startTimer(Number(ds.sec), Number(ds.max) || Number(ds.sec), ds.label, r ? r.e + ' ' + r.n + (st >= 0 ? ' · шаг ' + (st + 1) : '') : 'Таймер');
      if (M && M.custom) { M.custom = false; renderModal(); }
      break;
    }
    case 'tPause': { const t = TIMERS.find(x => x.id === ds.id); if (!t) break;
      if (t.paused == null) t.paused = tLeft(t); else { t.ends = Date.now() + t.paused * 1000; t.paused = null; ensureAudio(); keepAwake(); }
      saveTimers(); renderTimers(); break; }
    case 'tAdd': { const t = TIMERS.find(x => x.id === ds.id); if (!t) break;
      if (t.paused != null) t.paused += 60; else t.ends += 60000; saveTimers(); renderTimers(); break; }
    case 'tDel': TIMERS = TIMERS.filter(x => x.id !== ds.id); saveTimers(); renderTimers(); tick(); break;
    case 'logStart': M.log = true; M.rating = 0; renderModal(); break;
    case 'logCancel': M.log = false; renderModal(); break;
    case 'rate': M.rating = Number(ds.v); { const n = $('#lognote') ? $('#lognote').value : ''; renderModal(); if ($('#lognote')) $('#lognote').value = n; } break;
    case 'logSave': {
      const note = ($('#lognote') || {}).value || '';
      S.log.push({ id: M.id, date: todayISO(), rating: M.rating, note: note.trim() });
      if (M.di != null) { const sl = S.plan.days[M.di].slots[M.m]; if (sl) sl.done = true; }
      save(); M.log = false; renderModal(); render(); toast('Браво! Записано в прогресс 🎉'); break;
    }
    case 'shopToggle': S.shop[ds.k] = !S.shop[ds.k]; save(); render(); break;
    case 'shopReset': S.shop = {}; save(); render(); break;
    case 'shopCopy': copy(shopText()); break;
    case 'libF': LIB.f = ds.v; render(); break;
    case 'resetAll':
      ask('Удалить все данные?', 'Меню, настройки и прогресс удалятся. Это нельзя отменить.', 'Удалить', () => {
        try { localStorage.removeItem(KEY); } catch(e){}
        S = EMPTY(); view = 'intro'; render();
        if (CLOUD.ref) { clearTimeout(CLOUD.timer); CLOUD.chain = CLOUD.chain.then(() => CLOUD.ref.delete()).catch(() => {}); }
      });
      break;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'budget') { Q.d.budget = Number(e.target.value); $('#bval').textContent = rub(Q.d.budget); $('#bper').textContent = '≈ ' + rub(Math.round(Q.d.budget / Q.d.people)) + ' на человека'; }
  if (e.target.id && e.target.id.startsWith('bc-') && Q.d && Q.d.body) { Q.d.body[e.target.id.slice(3)] = e.target.value; const el = $('#bc-result'); if (el) el.innerHTML = calcResultHTML(Q.d); }
  if (e.target.id === 'libq') { LIB.q = e.target.value; $('#liblist').innerHTML = libList(); }
  if (e.target.id === 'pickq') { M.q = e.target.value; const tmp = document.createElement('div'); tmp.innerHTML = pickerHTML(); $('#picklist').innerHTML = tmp.querySelector('#picklist').innerHTML; }
});
document.addEventListener('change', e => { if (e.target.id === 'budget') render(); });
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role=button][data-act]')) { e.preventDefault(); e.target.click(); return; }
  if (e.key === 'Escape' && M) { M = null; CONF = null; renderModal(); }
  if (view === 'quiz' && STEPS[Q.step].k === 'taste' && Q.ti < Q.deck.length && !M) {
    if (e.key === 'ArrowRight') react(1); if (e.key === 'ArrowLeft') react(-1);
  }
});
render();
renderTimers();
initCloud();
</script>
</body>
</html>
